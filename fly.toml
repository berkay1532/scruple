# Fly.io config for the Scruple service (indexer + webhooks + admin API).
app = "scruple-service"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile.service"

[mounts]
  source = "scruple_data"
  destination = "/data"

[env]
  INGEST_PORT = "8788"
  POLL_INTERVAL_MS = "5000"
  # Secrets (fly secrets set): RPC_URL, INGEST_SECRET, ADMIN_SECRET,
  # CARD_ISSUER_ADDRESS, SUBSCRIPTION_MANAGER_ADDRESS, START_BLOCK.

[http_service]
  internal_port = 8788
  force_https = true
  # The indexer must never sleep — it polls the chain continuously.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
